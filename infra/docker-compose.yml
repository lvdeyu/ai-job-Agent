name: ai-job-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-job-agent-postgres
    environment:
      POSTGRES_USER: ai_job_agent
      POSTGRES_PASSWORD: ai_job_agent
      POSTGRES_DB: ai_job_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_job_agent -d ai_job_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-job-agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai-job-agent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ai_job_agent
      MINIO_ROOT_PASSWORD: ai_job_agent_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
